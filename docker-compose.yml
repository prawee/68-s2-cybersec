include:
  - db.yaml
services:
  s2app:
    image: prawee/strapi
    container_name: 68-s2-app
    ports:
      - ${APP_PORT}:1337
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: 172.18.0.2
      DATABASE_PORT: 5432
    depends_on:
      - s2db