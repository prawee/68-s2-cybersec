services:
  s2app:
    image: prawee/strapi
    container_name: 68-s2-app
    ports:
      - ${APP_PORT}:1337
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: s2db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASS}
    depends_on:
      - s2db